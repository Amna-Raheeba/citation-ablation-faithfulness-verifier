[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-ablation-faithfulness-verifier"
version = "0.1.0"
description = "Verifies that an answer's citations are actually load-bearing: ablate each cited passage and re-check whether the answer still stands."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
